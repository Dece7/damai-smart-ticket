<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理后台 - 大麦智能票务助手</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #f0f2f5; color: #1a1a2e; min-height: 100vh; }

        .nav {
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            padding: 16px 32px; display: flex; align-items: center; gap: 16px;
        }
        .nav a { color: #8892b0; text-decoration: none; font-size: 13px; transition: color 0.2s; }
        .nav a:hover { color: #fff; }
        .nav-title { color: #fff; font-size: 16px; font-weight: 600; }

        .container { max-width: 1200px; margin: 0 auto; padding: 28px 24px; }

        .cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 28px; }
        .card {
            background: #fff; border-radius: 14px; padding: 20px 24px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.06);
            border-left: 3px solid transparent;
            transition: border-color 0.2s;
        }
        .card:nth-child(1) { border-left-color: #3b82f6; }
        .card:nth-child(2) { border-left-color: #8b5cf6; }
        .card:nth-child(3) { border-left-color: #e94560; }
        .card:nth-child(4) { border-left-color: #06b6d4; }
        .card-label { font-size: 12px; color: #6b7280; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
        .card-value { font-size: 28px; font-weight: 700; color: #1a1a2e; font-variant-numeric: tabular-nums; }
        .card-value.accent { color: #e94560; }

        .charts { display: grid; grid-template-columns: 3fr 2fr; gap: 20px; }
        .chart-box {
            background: #fff; border-radius: 14px; padding: 24px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.06);
        }
        .chart-title { font-size: 14px; font-weight: 600; color: #1a1a2e; margin-bottom: 16px; }
        .chart-canvas { width: 100%; max-height: 320px; }

        .empty-state {
            text-align: center; padding: 60px 20px; color: #9ca3af;
        }
        .empty-state p { font-size: 14px; margin-top: 8px; }

        @media (max-width: 768px) {
            .cards { grid-template-columns: repeat(2, 1fr); }
            .charts { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
<div id="app">
    <div class="nav">
        <a href="/">← 返回对话</a>
        <span class="nav-title">管理后台</span>
    </div>

    <div class="container">
        <div class="cards">
            <div class="card">
                <div class="card-label">总对话数</div>
                <div class="card-value">{{ summary.total_conversations }}</div>
            </div>
            <div class="card">
                <div class="card-label">总消息数</div>
                <div class="card-value">{{ summary.total_messages }}</div>
            </div>
            <div class="card">
                <div class="card-label">总 Token</div>
                <div class="card-value accent">{{ formatNum(summary.total_tokens) }}</div>
            </div>
            <div class="card">
                <div class="card-label">平均 Token / 消息</div>
                <div class="card-value">{{ formatNum(summary.avg_tokens) }}</div>
            </div>
        </div>

        <div v-if="summary.total_messages === 0" class="empty-state">
            <p>暂无统计数据，请先发送一些对话</p>
        </div>

        <div v-else class="charts">
            <div class="chart-box">
                <div class="chart-title">每日 Token 消耗趋势</div>
                <canvas ref="trendCanvas" class="chart-canvas"></canvas>
            </div>
            <div class="chart-box">
                <div class="chart-title">模式用量对比</div>
                <canvas ref="modeCanvas" class="chart-canvas"></canvas>
            </div>
        </div>
    </div>
</div>

<script>
const { createApp, ref, onMounted, nextTick } = Vue

createApp({
    setup() {
        const summary = ref({ total_messages: 0, total_conversations: 0, total_tokens: 0, avg_tokens: 0 })
        const trendCanvas = ref(null)
        const modeCanvas = ref(null)

        const formatNum = (n) => n >= 1000 ? (n / 1000).toFixed(1) + 'k' : String(n)

        const modeLabels = { assistant: '贴心助手', rag: '规则助手', agent: 'Agent' }
        const modeColors = { assistant: '#e94560', rag: '#22c55e', agent: '#3b82f6' }

        const loadData = async () => {
            const [sRes, tRes, mRes] = await Promise.all([
                fetch('/api/admin/stats/summary'),
                fetch('/api/admin/stats/trend?days=30'),
                fetch('/api/admin/stats/by_mode'),
            ])
            summary.value = await sRes.json()
            const trend = await tRes.json()
            const modes = await mRes.json()

            await nextTick()

            if (trend.length && trendCanvas.value) {
                new Chart(trendCanvas.value, {
                    type: 'bar',
                    data: {
                        labels: trend.map(d => d.date.slice(5)),
                        datasets: [
                            {
                                label: '输入 Token',
                                data: trend.map(d => d.prompt_tokens),
                                backgroundColor: '#f59e0b',
                                borderRadius: 3,
                            },
                            {
                                label: '输出 Token',
                                data: trend.map(d => d.completion_tokens),
                                backgroundColor: '#06b6d4',
                                borderRadius: 3,
                            },
                        ],
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: true,
                        plugins: {
                            legend: { position: 'bottom', labels: { boxWidth: 12, padding: 16 } },
                        },
                        barPercentage: 0.45,
                        categoryPercentage: 0.6,
                        scales: {
                            x: { stacked: true, grid: { display: false }, ticks: { font: { size: 11 } } },
                            y: { stacked: true, grid: { color: '#f3f4f6' }, ticks: { font: { size: 11 } } },
                        },
                    },
                })
            }

            if (modes.length && modeCanvas.value) {
                new Chart(modeCanvas.value, {
                    type: 'doughnut',
                    data: {
                        labels: modes.map(m => modeLabels[m.chat_type] || m.chat_type),
                        datasets: [{
                            data: modes.map(m => m.total_tokens),
                            backgroundColor: modes.map(m => modeColors[m.chat_type] || '#94a3b8'),
                            borderWidth: 2,
                            borderColor: '#fff',
                        }],
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: true,
                        cutout: '55%',
                        plugins: {
                            legend: { position: 'bottom', labels: { boxWidth: 12, padding: 16 } },
                        },
                    },
                })
            }
        }

        onMounted(loadData)

        return { summary, trendCanvas, modeCanvas, formatNum }
    }
}).mount('#app')
</script>
</body>
</html>
